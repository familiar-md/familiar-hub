<!doctype html>
<!-- Fleet brief page template. scripts/brief.py pastes brief-latest.json into the data slot below and
     writes the result to _overview/brief-latest.html. Edit this file, never the generated page.
     Self-contained on purpose: no network, no fonts, no libraries, so it opens from disk anywhere. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet brief</title>
<style>
:root {
  color-scheme: light;
  --bg: #f1e9dc; --surface: #f8f2e8; --surface-2: #ece2d2; --line: #dacdb8;
  --ink: #1a1815; --ink-2: #574e44; --ink-3: #7f7568;
  --critical: #d03b3b; --serious: #e0782f; --warning: #fab219; --good: #0ca30c;
  --critical-ink: #a32626; --serious-ink: #94410f; --critical-bg: #f9e6e0; --serious-bg: #f9e8d8;
  --later: #8f877b; --parked: #cfc6b8; --clash: rgba(208, 59, 59, .07); --today: #b8500f;
  --me-bg: #f4d9c0; --me-ink: #86340a; --away: rgba(86, 120, 124, .16); --away-line: rgba(86, 120, 124, .5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1c1b1a; --surface: #242321; --surface-2: #2d2b28; --line: #3d3a35;
    --ink: #f2e5d4; --ink-2: #cdbfae; --ink-3: #9b8e7d;
    --critical-ink: #f08a8a; --serious-ink: #f0a070; --critical-bg: #3a1d1c; --serious-bg: #3d2415;
    --later: #8d8579; --parked: #4d4943; --clash: rgba(240, 138, 138, .08); --today: #e0782f;
    --me-bg: #4a2a15; --me-ink: #f6d2b0; --away: rgba(120, 165, 170, .20); --away-line: rgba(120, 165, 170, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1c1b1a; --surface: #242321; --surface-2: #2d2b28; --line: #3d3a35;
  --ink: #f2e5d4; --ink-2: #cdbfae; --ink-3: #9b8e7d;
  --critical-ink: #f08a8a; --serious-ink: #f0a070; --critical-bg: #3a1d1c; --serious-bg: #3d2415;
  --later: #8d8579; --parked: #4d4943; --clash: rgba(240, 138, 138, .08); --today: #e0782f;
  --me-bg: #4a2a15; --me-ink: #f6d2b0; --away: rgba(120, 165, 170, .20); --away-line: rgba(120, 165, 170, .55);
}
* { box-sizing: border-box; }
mark.me { background: var(--me-bg); color: var(--me-ink); font-weight: 650; border-radius: 4px; padding: 0 4px; }
.owner { color: var(--ink-2); }
.owner.none { color: var(--ink-3); font-style: italic; }
.pill.away { border-color: var(--away-line); background: var(--away); color: var(--ink); }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
section { margin-top: 28px; }
.sub { color: var(--ink-2); margin-top: 4px; }
.muted { color: var(--ink-3); }
code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
.banner { border-radius: 8px; padding: 10px 14px; margin-top: 16px; border: 1px solid var(--line); background: var(--surface); }
.banner.bad { border-color: var(--critical); background: var(--critical-bg); color: var(--critical-ink); font-weight: 600; }
.banner.warn { border-color: var(--serious); background: var(--serious-bg); }

/* filter */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px;
  padding: 4px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .k { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.tile[data-tip] { cursor: help; }
.tile.hot .v { color: var(--critical-ink); }
@media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* milestone rows */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: 112px 1fr auto; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: start; }
.row:first-child { border-top: 0; }
.when { font-variant-numeric: tabular-nums; }
.when b { display: block; font-size: 13.5px; }
.when span { font-size: 12px; color: var(--ink-3); }
.row.over .when span { color: var(--critical-ink); font-weight: 600; }
.list.now .row { border-left: 4px solid transparent; }
.list.now .row.over { border-left-color: var(--critical); }
.pill[data-tip] { cursor: help; }
#tip b + br, #tip b { margin-top: 2px; }
.what .proj { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.what .name { margin-top: 1px; }
.what .meta { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 11.5px; border-radius: 999px; padding: 2px 8px; white-space: nowrap; border: 1px solid var(--line); color: var(--ink-2); }
.pill.over { border-color: var(--critical); color: var(--critical-ink); background: var(--critical-bg); font-weight: 600; }
.pill.risk { border-color: var(--serious); color: var(--serious-ink); background: var(--serious-bg); font-weight: 600; }
.pill.stale { border-style: dashed; }
.empty { padding: 14px; color: var(--ink-3); }
@media (max-width: 640px) { .row, .row.mt { grid-template-columns: 1fr; gap: 4px; } .pills { justify-content: flex-start; }
}

/* pending changes: collected on this page, applied only through the hub's /fleet update */
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.act { border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 6px; padding: 1px 8px;
  font: inherit; font-size: 12px; cursor: pointer; }
.act:hover { border-color: var(--ink-3); color: var(--ink); }
.act.on { border-color: var(--today); color: var(--today); }
.editor { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.editor input { font: inherit; font-size: 12.5px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); }
.editor input[type="text"] { min-width: 220px; flex: 1; }
.row.pend .name, li.pend .t { text-decoration: line-through; color: var(--ink-3); }
.row.pend.move .name { text-decoration: none; }
.pill.pending { border-color: var(--today); color: var(--today); }
.tact { margin-left: 8px; }
.tact + .tact { margin-left: 4px; }
li .editor { margin: 4px 0 6px; }
.editor textarea { font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); width: 100%; resize: vertical; }
.editor label { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 5px; align-items: center; }
.editor .hint { flex-basis: 100%; font-size: 12px; color: var(--ink-3); }

/* meetings in the lists: one thin line (date, shape, time, name, project) that opens on click */
.row.mt { padding: 5px 14px; align-items: start; font-size: 13px; }
.row.mt .when b { font-size: 12.5px; font-weight: 600; line-height: 20px; }
.row.mt .mt-line { min-height: 20px; }
.row.mt .what { min-width: 0; }
.acts .pill.pending { white-space: normal; }
.mt-line { all: unset; cursor: pointer; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; border-radius: 4px; }
.mt-line:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mt-line:hover .mt-n { text-decoration: underline; }
.mt-line .proj { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.mt-line .chev { color: var(--ink-3); font-size: 11px; }
.mt-line .sep { color: var(--ink-3); }
.row.mt .acts { margin-top: 3px; }
.mt-body { margin: 6px 0 4px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-size: 12.5px; }
.mt-body .k { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.mt-body .k:first-child { margin-top: 0; }
.mt-body ol { margin: 2px 0 0; padding-left: 20px; }
.mt-body textarea { width: 100%; margin-top: 6px; font: 12px ui-monospace, Consolas, monospace; background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px; resize: vertical; }
.chip.mtgchip { margin-left: auto; }
#pendbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--serious-bg); border-top: 4px solid var(--serious);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, .12); padding: 10px 16px; z-index: 5; }
#pendbar .in { max-width: 1180px; margin: 0 auto; }
#pendbar .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#pendbar .top b { margin-right: auto; color: var(--serious-ink); }
#pendbar ul { margin: 8px 0 6px; padding: 0; list-style: none; max-height: 30vh; overflow: auto; font: 12.5px ui-monospace, Consolas, monospace; }
#pendbar li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
#pendbar li span { flex: 1; word-break: break-word; }
#pendbar textarea { width: 100%; box-sizing: border-box; font: 12px ui-monospace, Consolas, monospace; background: var(--surface-2);
  color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px; resize: vertical; }
#pendbar .hint { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
body.has-pend main { padding-bottom: 120px; }

/* timeline */
.tl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 8px; overflow-x: auto; }
.tl-grid { min-width: 720px; position: relative; }
.tl-row { display: grid; grid-template-columns: 220px 56px 1fr; align-items: center; min-height: 30px; border-top: 1px solid var(--line); }
.tl-row.head { border-top: 0; min-height: 22px; font-size: 11.5px; color: var(--ink-3); }
.tl-row .lbl { font-size: 12.5px; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-row.parked .lbl { color: var(--ink-3); }
.tl-row .lbl .sig { font: 11.5px ui-monospace, Consolas, monospace; color: var(--ink-3); margin-right: 6px; }
.tl-over, .tl-track { position: relative; height: 30px; }
.tl-over { border-right: 1px dashed var(--line); }
.tl-track .wk { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: .6; }
.tl-track .clash { position: absolute; top: 0; bottom: 0; background: var(--clash); }
.tl-track .past { position: absolute; top: 0; bottom: 0; left: 0; background: var(--line); opacity: .35; }
.tl-track .now { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--today); }
.tl-track .off { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--away-line); border-right: 1px solid var(--away-line);
  background: repeating-linear-gradient(45deg, var(--away) 0 5px, transparent 5px 9px); }
.tl-row.away .lbl { color: var(--ink-2); font-style: italic; }
.tl-row.away .tl-track .off span { position: static; transform: none; display: block; font-size: 11px; color: var(--ink); padding: 0 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-row.head .tl-track span { position: absolute; padding-left: 5px; white-space: nowrap; } /* starts at its Monday line */
/* timeline markers: the button is a transparent hit area, the <i> inside is the shape in the urgency colour */
.dot { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 0; background: transparent;
  cursor: default; padding: 0; display: grid; place-items: center;
  filter: drop-shadow(1px 0 0 var(--surface)) drop-shadow(-1px 0 0 var(--surface)) drop-shadow(0 1px 0 var(--surface)) drop-shadow(0 -1px 0 var(--surface)); }
.dot i { position: relative; display: block; width: 12px; height: 12px; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.dot.s-client-meeting i, .dot.s-internal-meeting i { width: 12px; height: 12px; clip-path: circle(50%); }
/* shape = kind (star deliverable, diamond other milestone, solid circle client meeting, open circle internal meeting);
   colour = urgency, the same for all */
.dot.s-internal-meeting i::after { content: ""; position: absolute; inset: 2.5px; background: var(--surface); clip-path: circle(50%); }
.dot.s-deliverable i { width: 17px; height: 17px;
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.dot:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
/* meetings from meetings.md: a smaller shape in a lower lane of the project's row, never urgency-coloured */
.tl-row.has-mtg { min-height: 42px; }
.tl-row.has-mtg .tl-over, .tl-row.has-mtg .tl-track { height: 42px; }
.tl-row.has-mtg .dot:not(.mtg) { top: 34%; }
.dot.mtg { top: 79%; width: 12px; height: 12px; margin: -6px 0 0 -6px; }
.dot.mtg.s-client-meeting i, .dot.mtg.s-internal-meeting i { width: 9px; height: 9px; }
.dot.mtg.s-internal-meeting i::after { inset: 2px; }
.pill.client { border-color: var(--ink-3); color: var(--ink); }
/* every list row: date, then the type marker (the timeline's own shape and urgency colour) and its word,
   then the project (signature over name) in its own column */
.tp { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 11.5px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.row .when span.tp { font-size: 11.5px; color: var(--ink-2); }
.tp .dot { position: relative; top: auto; margin: 0; width: 16px; height: 16px; flex: none; filter: none; }
.pj { font-size: 12px; color: var(--ink-2); font-weight: 600; overflow-wrap: anywhere; }
.pj .sig { font: 11.5px ui-monospace, Consolas, monospace; color: var(--ink-3); font-weight: 400; margin-right: 6px; }
.pill.caution { background: var(--warning); border-color: var(--warning); color: #1a1100; font-weight: 650; }
.u-now { background: var(--critical); } .u-soon { background: var(--serious); }
.u-later { background: var(--later); } .u-parked { background: var(--parked); }
.u-other { background: var(--ink-3); } .dot i.u-done, .legend i.u-done { background: var(--ink-3); opacity: .4; } .dot i.u-later, .legend i.u-later { background: var(--warning); }
.dot.risk { filter: drop-shadow(1.5px 0 0 var(--serious)) drop-shadow(-1.5px 0 0 var(--serious)) drop-shadow(0 1.5px 0 var(--serious)) drop-shadow(0 -1.5px 0 var(--serious)); }
.legend .dot { position: relative; top: auto; margin: 0 3px 0 0; display: inline-grid; vertical-align: -4px; width: 16px; height: 16px; }
.tl-row.head .tl-track span.heavy { color: var(--serious-ink); font-weight: 700; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.box { border-radius: 2px; background: var(--clash); border: 1px solid var(--critical); }
.legend i.line { border-radius: 0; width: 2px; background: var(--today); }
.legend .dot i { border-radius: 0; margin: 0; vertical-align: 0; }
.legend .dot.s-internal-meeting i::after { background: var(--bg); }
.legend i.off {border-radius: 2px; border: 1px solid var(--away-line); background: repeating-linear-gradient(45deg, var(--away) 0 3px, transparent 3px 5px); }
#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 340px; background: var(--ink); color: var(--bg);
  font-size: 12.5px; padding: 8px 10px; border-radius: 6px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
#tip b { display: block; }

/* full timeline: one vertical list for the whole span, week by week */
.fl > summary { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.fl-body { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px 10px; }
.fl-month { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 14px 0 4px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
.fl-week { display: grid; grid-template-columns: 168px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.fl-month + .fl-week { border-top: 0; }
.fl-week.now { border-left: 3px solid var(--today); padding-left: 8px; margin-left: -11px; }
.fl-wk b { display: block; font-size: 13px; }
.fl-wk span { display: block; font-size: 12px; color: var(--ink-3); }
.fl-wk .heavy { color: var(--serious-ink); font-weight: 700; }
.fl-wk .away { color: var(--me-ink); }
.fl-item { display: grid; grid-template-columns: 86px 22px minmax(120px, 210px) 1fr auto; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 13px; }
.fl-item.done { color: var(--ink-3); }
.fl-item.done .fl-name { text-decoration: line-through; }
.fl-item.clash { background: var(--clash); border-radius: 4px; }
.fl-item .fl-d { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.fl-item .fl-proj { font-size: 12px; font-weight: 600; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-item .fl-st { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.fl-item .fl-st .pill { margin-left: 6px; }
.fl-item .dot { position: relative; top: auto; margin: 0; align-self: center; }
.fl-gap { font-size: 12px; color: var(--ink-3); padding: 6px 0; border-top: 1px dashed var(--line); text-align: center; }
@media (max-width: 720px) { .fl-week { grid-template-columns: 1fr; gap: 4px; } .fl-item { grid-template-columns: 62px 22px 1fr; } .fl-item .fl-proj { grid-column: 3; } .fl-item .fl-name { grid-column: 1 / -1; } .fl-item .fl-st { grid-column: 1 / -1; } }

/* project cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card.parked { opacity: .78; }
.card h3 { font-size: 14.5px; margin: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card .facts { font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.card .next { margin-top: 8px; font-size: 13px; }
.card .next .k { font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.card details { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.card summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.card ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.card li { margin: 3px 0; }
.card li .id { font: 11.5px ui-monospace, Consolas, monospace; color: var(--ink-3); margin-right: 4px; }
.card li .by { display: block; font-size: 12px; color: var(--ink-3); }
.card li .owner { font-size: 12px; margin-left: 4px; }
.card .probs { margin-top: 8px; font-size: 12.5px; color: var(--serious-ink); }
.group > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); margin: 14px 0 8px; }
footer { margin-top: 32px; font-size: 12px; color: var(--ink-3); }
footer ul { padding-left: 18px; }
.theme { float: right; }
@media print {
  body { background: #fff; } .filters, .theme { display: none; }
  details > *:not(summary) { display: block !important; }
}
.wordmark { font: 400 30px/1 Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
  letter-spacing: -.01em; color: var(--ink); margin: 0 0 6px; position: relative; z-index: 0; }
.wordmark .ili { position: relative; display: inline-block; }
.wordmark .ili::before { content: ""; position: absolute; inset: -40% -35%; z-index: -1;
  background: radial-gradient(closest-side, rgba(210, 98, 26, .7), rgba(210, 98, 26, 0)); }
</style>
</head>
<body>
<main id="app"><p>Loading brief…</p></main>
<div id="tip" role="tooltip"></div>
<script id="brief-data" type="application/json">__BRIEF_DATA__</script>
<script>
(function () {
  "use strict";
  var SCHEMA = 1;
  var app = document.getElementById("app");
  var D;
  try { D = JSON.parse(document.getElementById("brief-data").textContent); }
  catch (e) { app.innerHTML = '<div class="banner bad">This page has no brief data. Open it as written by <code>scripts/brief.py</code>, not the template.</div>'; return; }

  // ---------- helpers
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function md(s) { // the small subset of Markdown project files use inline
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")

  // A list holds milestones and, as thin rows, meetings (from each project's meetings.md), in date order;

  function clashDays(ms) { // days with 2+ active projects due, from the milestones on show
    var by = {};

    return Object.keys(by).sort().filter(function (d) { return Object.keys(by[d]).length >= 2; })

  }

  // The timeline always covers whole work weeks: Monday of this week through Friday of week N (6), whatever today is.
  // Saturday and Sunday have no column: a weekend date sits on that Friday (on the next Monday for a start date).
  var WEEKS = D.timeline_weeks || 6;
  function tlRange() {
    var t = day(D.today), mon = new Date(t.getFullYear(), t.getMonth(), t.getDate() - ((t.getDay() + 6) % 7));
    var fri = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 7 * (WEEKS - 1) + 4);
    return { start: mon, last: fri, end: new Date(fri.getFullYear(), fri.getMonth(), fri.getDate() + 1) }; // end is exclusive
  }

  function timeline(ms) {
    var R = tlRange(), start = R.start, end = R.end;
    var span = WEEKS * 5;
    function at(isoDate, fwd) { // work days from the first Monday
      var n = Math.round((day(isoDate) - start) / 86400000), w = Math.floor(n / 7), dw = n - w * 7;
      return w * 5 + (dw > 4 ? (fwd ? 5 : 4) : dw);

    function x(isoDate, fwd) { return Math.min(100, Math.max(0, (at(isoDate, fwd) + 0.5) / span * 100)); } // centre of that day

    ms = ms.filter(function (m) { return m.window === "overdue" || day(m.due) < new Date(end.getFullYear(), end.getMonth(), end.getDate() + 2); }); // through the last weekend
    // A heavy week: HEAVY or more deliverables due in it, across the projects shown (it follows the filter).
    var HEAVY = D.heavy_week || 3, perWeek = {};
    ms.forEach(function (m) {
      if (m.shape !== "deliverable" || m.window === "overdue" || !rows.some(function (p) { return p.name === m.project; })) return;
      var w = Math.floor(at(m.due) / 5); if (w < 0 || w >= WEEKS) return;
      (perWeek[w] = perWeek[w] || []).push(m);
    });
    var ticks = "", heads = "";
    for (var d = new Date(start); d < end; d.setDate(d.getDate() + 1)) {
      if (d.getDay() === 1) { var i = iso(d), px = at(i) / span * 100, list = perWeek[Math.floor(at(i) / 5)] || [];

            list.map(function (m) { return esc(fmt(m.due)) + " · " + esc(m.project) + " · " + md(m.name); }).join("<br>")) + '">⚠ ' + esc(fmt(i)) + "</span>";
        } else heads += '<span style="left:' + px + '%">' + esc(fmt(i)) + "</span>";

    // Completed milestones stay on the timeline, greyed. They carry no urgency and no actions.

      return arr.map(function (c) {

    }
    function mineMeetings(name) { return meetings.filter(function (m) { return mtgOn(m) && m.project === name && day(m.date) < lastDay; }); }
    function mdots(arr) {
      var count = {}, seen = {};
      arr.forEach(function (m) { count[m.date] = (count[m.date] || 0) + 1; });
      return arr.map(function (m) {
        var nth = seen[m.date] = (seen[m.date] || 0) + 1, off = count[m.date] > 1 ? (nth - 1 - (count[m.date] - 1) / 2) * 11 : 0;

          (label ? "<span>✈ " + esc(t.note || "Time off") + "</span>" : "") + "</div>";
      }).join("");
    }
    var clashes = clashDays(ms).map(function (c) {
      return '<div class="clash" style="left:' + (x(c.date) - dayW / 2) + "%;width:" + dayW + '%" title="' + esc(c.date + ": " + c.projects.join(", ")) + '"></div>';
    }).join("");
    var html = '<div class="tl"><div class="tl-grid"><div class="tl-row head"><div></div><div>Overdue</div><div class="tl-track">' + heads + "</div></div>";
    if (timeOff.length) html += '<div class="tl-row away"><div class="lbl">Your time off</div><div class="tl-over"></div><div class="tl-track">' + bands(true) + ticks + "</div></div>";
    rows.forEach(function (p) {
      var mine = ms.filter(function (m) { return m.project === p.name; });
      var over = mine.filter(function (m) { return m.window === "overdue"; });
      // Markers due the same day in one row sit side by side, 13px apart, centred on the day; a deliverable is

      var tint = function (m) { return m.window === "overdue" ? "u-now" : m.urgency === "soon" ? "u-later" : "u-" + m.urgency; };
      var dots = function (arr, pos, spread) {
        var count = {}, seen = {};
        arr = arr.slice().sort(function (a, b) { return (a.shape === "deliverable") - (b.shape === "deliverable"); });

        return arr.map(function (m, k) {
        var nth = seen[m.due] = (seen[m.due] || 0) + 1, off = spread && count[m.due] > 1 ? (nth - 1 - (count[m.due] - 1) / 2) * 13 : 0;

      (timeOff.length ? '<span><i class="off"></i>Your time off</span>' : "") + '<span><i class="line"></i>Brief date</span></div>' +
      '<div class="legend">' + [["deliverable", "Deliverable"], ["other", "Other milestone"], ["client-meeting", "Client meeting"], ["internal-meeting", "Internal meeting"]]

  }

  // A task: ✓ Done, Move date and Edit. Task rows carry no date, so Move date starts empty.

  function card(p) {

    var over = D.milestones.filter(function (m) { return m.project === p.name && m.window === "overdue"; }).length;

  // ---------- full timeline: every dated milestone of the active projects, whole span, week by week (collapsed by default)
  var fullOpen = false;

  function mondayOf(isoDate) { var d = day(isoDate); return iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7))); }

      .concat((F.done || []).filter(function (c) { return shown(c.project); }).map(function (c) { return { m: c, done: true }; }));

          '<span class="fl-proj" title="' + esc(m.project) + '">' + esc(m.project) + '</span><span class="fl-name">' + md(m.name) + '</span><span class="fl-st">' + (it.done ? "done" : esc(m.status || "")) + tags + "</span></div>";
      }).join("") + "</div></div>";

  }
  app.addEventListener("toggle", function (e) { if (e.target.classList && e.target.classList.contains("fl")) fullOpen = e.target.open; }, true);

  function render() {
    var ms = D.milestones.filter(function (m) { return m.urgency !== "parked" && shown(m.project); });
    var now = ms.filter(function (m) { return m.urgency === "now"; });
    var soon = ms.filter(function (m) { return m.urgency === "soon"; });
    var later = ms.filter(function (m) { return m.urgency === "later"; });
    var parked = D.milestones.filter(function (m) { return m.urgency === "parked"; });
    var counts = {}; D.milestones.forEach(function (m) { if (m.urgency === "now") counts[m.project] = (counts[m.project] || 0) + 1; });
    // Meetings join the lists by brief.py's urgency. With a meetings chip off only agenda-due ones stay: those are things to do.
    var mts = meetings.filter(function (m) { return shown(m.project) && (mtgOn(m) || m.agenda_due); });
    function plus(level) { return mts.filter(function (m) { return m.urgency === level; }); }
    var agendas = meetings.filter(function (m) { return m.agenda_due; });
    agendas.forEach(function (m) { counts[m.project] = (counts[m.project] || 0) + 1; });
    var agendasShown = agendas.filter(function (m) { return shown(m.project); }).length;

    var h = head + '<div class="sub">' + plural(live.length, "active project") + (parkedProjects.length ? " (" + parkedProjects.length + " paused or closed, folded at the bottom)" : "") +
      " · looking ahead " + esc(ahead) + ", to " + esc(fmt(D.lookahead, true)) + (D.scope ? " · " + md(D.scope) : "") + "</div>" + banners;
    if (staleNames.length) h += '<div class="banner warn">▲ Treat as unconfirmed — active but stale or undated: ' + staleNames.map(esc).join(", ") + ".</div>";
    if (timeOff.length) h += '<div class="banner">✈ Your time off in this window: ' + timeOff.map(function (t) { return esc(range(t)) + (t.note ? " (" + md(t.note) + ")" : ""); }).join("; ") + ".</div>";
    if (D.notes.length) h += '<div class="banner warn">Settings: ' + D.notes.map(md).join(" ") + "</div>";
    if ((D.signature_notes || []).length) h += '<div class="banner">Signatures: ' + D.signature_notes.map(md).join(" ") + "</div>";

    h += '<div class="filters" role="group" aria-label="Filter by project"><button type="button" class="chip" data-f="" aria-pressed="' + !filter + '">All active projects</button>' +
      live.map(function (p) { return '<button type="button" class="chip" data-f="' + esc(p.name) + '" aria-pressed="' + (filter === p.name) + '"' +
        (counts[p.name] ? ' title="' + plural(counts[p.name], "item") + ' to do now"' : "") + ">" + esc(p.name) +
        (counts[p.name] ? '<span class="n">' + counts[p.name] + "</span>" : "") + "</button>"; }).join("") +
      (meetings.length ? '<button type="button" class="chip mtgchip" data-mtg="client" aria-pressed="' + showClient + '" title="Client meetings in the lists and the timeline; agendas to set always show">Client meetings</button>' +
        '<button type="button" class="chip mtgchip" data-mtg="internal" aria-pressed="' + showInternal + '" title="Internal meetings in the lists and the timeline; agendas to set always show">Internal meetings</button>' : "") + "</div>";

    var startable = live.filter(function (p) { return shown(p.name) && p.startable; })
      .reduce(function (n, p) { return n + p.startable.length; }, 0);
    function tally(rows) { var c = {}; rows.forEach(function (m) { c[m.project] = (c[m.project] || 0) + 1; }); return c; }
    function tileTip(title, c) {
      var names = Object.keys(c).sort();
      return ' tabindex="0" data-tip="' + esc("<b>" + title + "</b>" + (names.length ? names.map(function (n) { return esc(n) + " — " + c[n]; }).join("<br>") : "No projects")) + '"';
    }
    var nowTally = tally(now); agendas.forEach(function (m) { if (shown(m.project)) nowTally[m.project] = (nowTally[m.project] || 0) + 1; });
    var startTally = {}; live.forEach(function (p) { if (shown(p.name) && p.startable && p.startable.length) startTally[p.name] = p.startable.length; });
    h += '<div class="tiles"><div class="tile' + (now.length + agendasShown ? " hot" : "") + '"' + tileTip("Do now", nowTally) + '><div class="v">' + (now.length + agendasShown) + '</div><div class="k">Do now (overdue or due ≤ ' + D.now_days + " days" +
      (agendasShown ? ", incl. " + plural(agendasShown, "agenda") + " to set" : "") + ")</div></div>" +
      '<div class="tile"' + tileTip("Watch", tally(soon)) + '><div class="v">' + soon.length + '</div><div class="k">Watch (next ' + period(D.settings.horizon_days) + " or at risk)</div></div>" +
      '<div class="tile"' + tileTip("Later", tally(later)) + '><div class="v">' + later.length + '</div><div class="k">Later, within ' + esc(ahead) + "</div></div>" +
      '<div class="tile"' + tileTip("Startable tasks", startTally) + '><div class="v">' + startable + '</div><div class="k">Startable tasks</div></div></div>';

    h += "<section><h2>Timeline \u2014 " + WEEKS + " weeks, " + esc(fmt(iso(tlRange().start), true)) + " to " + esc(fmt(iso(tlRange().last), true)) + "</h2>" +
      timeline(ms) + "</section>";
    h += '<section><h2>Do now</h2>' + list(now.concat(plus("now")), "Nothing overdue or due in the next " + D.now_days + " days.", "now") +
      '<div class="legend"><span><i class="u-now"></i>Overdue</span>' +
      (mts.length ? '<span class="muted">Thin rows are meetings from each project&#39;s meetings.md: click one to open it. Notes only: update your own calendar to match.</span>' : "") + "</div></section>";
    h += "<section><h2>Watch</h2>" + list(soon.concat(plus("soon")), "Nothing else due in the next " + period(D.settings.horizon_days) + ", and nothing at risk.") + "</section>";
    h += "<section><h2>Later</h2>" + list(later.concat(plus("later")), "No other dated milestones in the next " + ahead + ".") + "</section>";

    h += '<section><h2>Projects</h2><div class="cards">' + live.filter(function (p) { return shown(p.name); }).map(card).join("") + "</div></section>";
    h += fullTimeline();
    if (parkedProjects.length && !filter) h += '<details class="group"><summary>Paused, reference or closed (' + parkedProjects.length + ")" +
      (parked.length ? " — " + plural(parked.length, "dated milestone") : "") + '</summary><div class="cards">' + parkedProjects.map(card).join("") + "</div>" +
      (parked.length ? '<section><h2>Their dated milestones</h2>' + list(parked, "") + "</section>" : "") + "</details>";

    var clash = clashDays(D.milestones.filter(function (m) { return m.urgency !== "parked"; }));
    h += "<footer><b>Same day, 2+ active projects:</b> " + (clash.length ? clash.map(function (c) { return esc(c.date) + " (" + c.projects.map(esc).join(", ") + ")"; }).join("; ") : "none") +
      "<br><br>Generated by <code>scripts/brief.py</code> on " + esc(D.today) + " from each project&#39;s own trackers. This page changes nothing in them: changes you mark are collected in the bar at the bottom and applied only when you paste them into the hub&#39;s <code>/fleet</code> update. The page itself is rewritten with every brief. " +
      "The same facts are in <code>brief-latest.md</code> and <code>brief-latest.json</code>. Time off comes from <code>~/.familiar/time-off.md</code>" +
      (D.me && D.me.length ? "; your name is matched from <code>hub-settings.md</code> → <code>me</code>." : "; set <code>me</code> in <code>hub-settings.md</code> to highlight your own items.") +
      "<br>Sources: " + esc(D.sources) + "</footer>";
    app.innerHTML = h + panel();
  }

  // ---------- interaction
  app.addEventListener("click", function (e) {
    var mb = e.target.closest("[data-mtg]"); if (mb) { if (mb.getAttribute("data-mtg") === "client") showClient = !showClient; else showInternal = !showInternal; render(); return; }
    var f = e.target.closest("[data-f]");
    if (f) { filter = f.getAttribute("data-f") || null; render(); return; }
    var act = e.target.closest("[data-act]");
    if (act) {
      var a = act.getAttribute("data-act"), kind = act.getAttribute("data-kind"), project = act.getAttribute("data-project"), id = act.getAttribute("data-id"), on = act.getAttribute("data-on") || "";
      var name = ""; if (kind === "milestone" && msFind(project, id)) name = msFind(project, id).name; else if (kind === "task" && taskFind(project, id)) name = taskFind(project, id).title;
      var k = act.getAttribute("data-k") || "", box = act.closest(".editor");
      function bad(el, msg) { // say why on the field itself, then wait for the next try
        if (msg) { el.setCustomValidity(msg); el.reportValidity(); el.addEventListener("input", function () { el.setCustomValidity(""); }, { once: true }); }
        el.focus(); }
      function newTitle(was, strict) { // a name tracker_edit.py will accept, or null after saying why not
        var el = box.querySelector(".ed-name"), v = el.value.replace(/\s+/g, " ").trim();
        var why = !v ? "Give the new name" : v === plain(was).trim() ? "That is the name it has now" : /\|/.test(v) ? "A name cannot contain |" :
          strict && /\*\*|—/.test(v) ? "A name cannot contain ** or —" : "";
        if (why) { bad(el, why); return null; }
        return v; }
      function reason() { var el = box.querySelector(".ed-why"), v = clean(el.value); if (!v) bad(el, "A reason is required"); return v; }
      if (a === "done") setPending({ kind: "milestone", project: project, id: id, name: name, change: "status done", reason: "" });
      else if (a === "tdone") setPending({ kind: "task", project: project, id: id, name: name, change: "done", reason: "" });
      else if (a === "undo") setPending({ kind: kind, project: project, id: id, on: on });
      else if (a === "mtopen") { openMt[k] = !openMt[k]; if (!openMt[k] && editing && editing.indexOf(k + "\u0001") === 0) editing = null; }
      else if (/^(mmove|mdrop|mtitle|magenda|mnone|mremind)$/.test(a)) { editing = k + "\u0001" + a; }
      else if (a === "deck") { copyText(deckPrompt(mtFind(k))); copied = k; }
      else if (a === "save-mtitle") {
        var mname = newTitle(mtFind(k).meeting, false); if (mname === null) return;
        var mwhy0 = reason(); if (!mwhy0) return;
        setPending({ kind: "meeting", project: project, id: id, on: "title", change: "title " + mname, reason: mwhy0 }); editing = null;
      }
      else if (a === "save-magenda") {
        var ta = box.querySelector(".ed-items"), items = ta.value.split(/\r?\n/).map(function (t) { return t.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, "").replace(/\s+/g, " ").trim(); }).filter(Boolean);
        if (!items.length) { bad(ta, "Write at least one topic, or use No agenda needed"); return; }
        if (items.some(function (t) { return /[;|]/.test(t); })) { bad(ta, "A topic cannot contain ; or |"); return; }
        var st = box.querySelector(".ed-standing"), when = st && st.checked ? "standing" : mtFind(k).date;
        setPending({ kind: "meeting", project: project, id: id, on: "agenda " + when, change: "agenda " + when + " | items: " + items.join("; "), reason: "" }); editing = null;
      }
      else if (a === "save-mnone") {
        var nwhy = reason(); if (!nwhy) return; var nd = mtFind(k).date;
        setPending({ kind: "meeting", project: project, id: id, on: "agenda " + nd, change: "agenda " + nd + " | none: " + nwhy, reason: "" }); editing = null;
      }
      else if (a === "save-mremind") {
        var rin = box.querySelector('input[type="date"]'), rd = rin.value, rm = mtFind(k).date;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(rd)) { bad(rin, "Pick a date"); return; }
        if (rd < D.today || rd > rm) { bad(rin, "Pick a day from " + fmt(D.today, true) + " to the meeting, " + fmt(rm, true)); return; }
        setPending({ kind: "meeting", project: project, id: id, on: "remind " + rm, change: "remind " + rd + " on " + rm, reason: "" }); editing = null;
      }
      else if (a === "tmove" || a === "tedit" || a === "edit") { editing = pkey({ kind: kind, project: project, id: id }) + "\u0001" + a; }
      else if (a === "save-tmove") {
        var tin = box.querySelector('input[type="date"]'), td = tin.value;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(td)) { bad(tin, "Pick the new date"); return; }
        var twhy = reason(); if (!twhy) return;
        setPending({ kind: "task", project: project, id: id, name: name, change: "due " + td, reason: twhy }); editing = null;
      }
      else if (a === "save-tedit" || a === "save-edit") {
        var tname = newTitle(name, true); if (tname === null) return;
        var ewhy = reason(); if (!ewhy) return;
        setPending({ kind: kind, project: project, id: id, name: name, change: "title " + tname, reason: ewhy }); editing = null;
      }
      else if (a === "save-mmove") {
        var mbox = act.closest(".editor"), mdate = mbox.querySelector('input[type="date"]').value, mtime = clean(mbox.querySelector(".ed-time").value), mwhy = mbox.querySelector(".ed-why").value.trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(mdate)) { mbox.querySelector('input[type="date"]').focus(); return; }
        if (mtime && !/^\d{2}:\d{2}-\d{2}:\d{2}$/.test(mtime)) { mbox.querySelector(".ed-time").focus(); return; }
        if (!mwhy) { mbox.querySelector(".ed-why").focus(); return; }
        setPending({ kind: "meeting", project: project, id: id, on: on, change: "move " + (on ? on + " to " : "") + mdate + (mtime ? " " + mtime : ""), reason: mwhy }); editing = null;
      }
      else if (a === "save-mdrop") {
        var cbox = act.closest(".editor"), cwhy = cbox.querySelector(".ed-why").value.trim();
        if (!cwhy) { cbox.querySelector(".ed-why").focus(); return; }
        setPending({ kind: "meeting", project: project, id: id, on: on, change: "cancel" + (on ? " " + on : ""), reason: cwhy }); editing = null;
      }
      else if (a === "move" || a === "drop") { editing = pkey({ kind: "milestone", project: project, id: id }) + "\u0001" + a; }
      else if (a === "cancel") { editing = null; }
      else if (a === "save-move") {
        var box = act.closest(".editor"), date = box.querySelector('input[type="date"]').value, why = box.querySelector('input[type="text"]').value.trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { box.querySelector('input[type="date"]').focus(); return; }
        if (!why) { box.querySelector('input[type="text"]').focus(); return; }
        setPending({ kind: "milestone", project: project, id: id, name: name, change: "due " + date, reason: why }); editing = null;
      }
      else if (a === "save-drop") {
        var dbox = act.closest(".editor"), dwhy = dbox.querySelector('input[type="text"]').value.trim();
        if (!dwhy) { dbox.querySelector('input[type="text"]').focus(); return; }
        setPending({ kind: "milestone", project: project, id: id, name: name, change: "status not-applicable", reason: dwhy }); editing = null;
      }
      else if (a === "toggle") panelOpen = !panelOpen;
      else if (a === "remove") { pending.splice(+act.getAttribute("data-i"), 1); save(); }
      else if (a === "clear") { pending = []; panelOpen = false; save(); }
      else if (a === "copy") { copyText(pendingText()); panelOpen = true; }
      render();
      return;
    }
    var more = e.target.closest("[data-more]");
    if (more) { more.parentNode.querySelectorAll("li.more").forEach(function (li) { li.hidden = false; }); more.remove(); return; }
    if (e.target.id === "theme") {
      var root = document.documentElement, dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.setAttribute("data-theme", dark ? "light" : "dark");
      try { localStorage.setItem("fleet-brief-theme", root.getAttribute("data-theme")); } catch (err) { /* storage blocked: theme lasts this view only */ }
    }
  });
  var tip = document.getElementById("tip");
  function tipHtml(el) {
    if (el.hasAttribute("data-tip")) return el.getAttribute("data-tip"); // built with esc/md above
    if (el.hasAttribute("data-mt")) {
      var mt = (D.meetings || [])[+el.getAttribute("data-mt")]; if (!mt) return "";
      return "<b>" + esc(fmt(mt.date, true)) + " \u00b7 " + esc(rel(mt.days)) + "</b>" + esc(mt.project) + " \u00b7 " + esc(mt.kind) + " meeting<br>" + esc(hoursOf(mt)) + " " + md(mt.meeting) +
        (mt.attendees && mt.attendees.length ? '<br><span style="opacity:.75">' + esc(mt.attendees.join(", ")) + "</span>" : "") +
        (mt.source === "moved" ? "<br>Moved from " + esc(fmt(mt.moved_from, true)) : "") + (mt.overlaps && mt.overlaps.length ? "<br><b>Overlaps</b>" + mt.overlaps.map(esc).join("<br>") : "");
    }
    if (el.hasAttribute("data-cm")) {
      var cm = (D.completed || [])[+el.getAttribute("data-cm")]; if (!cm) return "";
      return "<b>" + esc(fmt(cm.due, true)) + " \u00b7 completed</b>" + esc(cm.project) + (cm.type ? " \u00b7 " + esc(cm.type) : "") + "<br>" + md(cm.name);
    }
    if (!el.hasAttribute("data-m")) return ""; // a legend or full-timeline shape: no tooltip
    var m = D.milestones[+el.getAttribute("data-m")]; if (!m) return "";
    return "<b>" + esc(fmt(m.due, true)) + " · " + esc(rel(m.days)) + "</b>" + esc(m.project) + (m.type ? " · " + esc(m.type) : "") + "<br>" + md(m.name) +
      '<br><span style="opacity:.75">' + (m.owner ? "Owner: " + md(m.owner) : "Owner not set") + " · " + (m.status ? md(m.status) : "status not set") + "</span>" +
      (m.at_risk && m.risk_reason ? "<br><b>At risk: what the timeline says</b>" + md(m.risk_reason) : "");
  }
  function showTip(el) {
    var html = tipHtml(el); if (!html) return;
    tip.innerHTML = html;
    var r = el.getBoundingClientRect(); tip.style.display = "block";
    var left = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2));
    var top = r.top - tip.offsetHeight - 8; if (top < 8) top = r.bottom + 8;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  var TIPPED = ".dot, [data-tip]";
  app.addEventListener("mouseover", function (e) { var d = e.target.closest(TIPPED); if (d) showTip(d); });
  app.addEventListener("mouseout", function (e) { if (e.target.closest(TIPPED)) tip.style.display = "none"; });
  app.addEventListener("focusin", function (e) { var d = e.target.closest(TIPPED); if (d) showTip(d); });
  app.addEventListener("focusout", function () { tip.style.display = "none"; });
  window.addEventListener("scroll", function () { tip.style.display = "none"; }, { passive: true });
  try { var saved = localStorage.getItem("fleet-brief-theme"); if (saved) document.documentElement.setAttribute("data-theme", saved); } catch (err) { /* no storage */ }

  render();
})();
</script>
</body>
</html>
